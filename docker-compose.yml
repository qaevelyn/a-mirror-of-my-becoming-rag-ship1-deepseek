# Usage:
#   docker compose up --build
#
# Requires Ollama running on the host machine with the deepseek-r1:1.5b model pulled.
# ============================================================

services:
  ship1-aws-rag:
    build: .
    image: ship1-aws-rag:latest
    container_name: ship1-aws-rag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./chroma_db:/app/chroma_db
